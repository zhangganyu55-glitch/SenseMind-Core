# M3 bring-up: BLE peripheral plus the MPU6050 I2C bus. No persistent storage.
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_DEVICE_NAME="SenseMind-Band"
CONFIG_BT_SMP=n
CONFIG_BT_PRIVACY=n
CONFIG_BT_SETTINGS=n
CONFIG_BT_DIS=y
CONFIG_BT_DIS_MODEL_NUMBER=y
CONFIG_BT_DIS_MODEL_NUMBER_STR="SenseMind Band M2"
CONFIG_BT_DIS_MANUF_NAME=y
CONFIG_BT_DIS_MANUF_NAME_STR="SenseMind"
CONFIG_BT_DIS_FW_REV=y
CONFIG_BT_DIS_FW_REV_STR="v0.7.0"
CONFIG_BT_DIS_PNP=n

# LF source is set in the overlay for Zephyr 4.5's split clock driver.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC_CALIBRATION=y

# This board's Zephyr definition supplies a USB CDC ACM console.
# It is an application USB stack, separate from the UF2 bootloader's CDC port.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_ENABLE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="SenseMind Band M2 Console"
CONFIG_CDC_ACM_SERIAL_MANUFACTURER_STRING="SenseMind lab test"
CONFIG_CDC_ACM_SERIAL_MAX_POWER=50

# Keep AP-protection policy consistent with the existing UICR; never lock it.
CONFIG_NRF_APPROTECT_USE_UICR=y

CONFIG_FLASH=n
CONFIG_FLASH_MAP=n
CONFIG_SETTINGS=n
CONFIG_BOOTLOADER_MCUBOOT=n
CONFIG_I2C=y
CONFIG_SPI=y
CONFIG_DISPLAY=y
CONFIG_ST7789V=y
CONFIG_ADC=n
CONFIG_PWM=n
CONFIG_GPIO=y
CONFIG_GPIO_HOGS=y
CONFIG_REBOOT=y
CONFIG_SENSEMIND_BOOTLOADER_CMD=y
CONFIG_WATCHDOG=n
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_BUILD_OUTPUT_HEX=y
CONFIG_BUILD_OUTPUT_BIN=y
CONFIG_BUILD_OUTPUT_UF2=y
CONFIG_MINIMAL_LIBC=y
CONFIG_MAIN_STACK_SIZE=8192
# Runtime high-water measurement for the UI thread (debug page).
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_GATT_CLIENT=y
CONFIG_ENTROPY_GENERATOR=y
